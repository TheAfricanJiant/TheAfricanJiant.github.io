name: Sync GitHub data and deploy

on:
  push:
    branches: [main]
  schedule:
    # 05:10 UTC every day - picks up any repo you pushed to yesterday
    - cron: '10 5 * * *'
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  repository_dispatch:      # let other repos trigger a refresh
    types: [sync]

permissions:
  contents: write
  pages: write
  id-token: write

# Queue runs one after another instead of cancelling the one in flight.
# Cancelling let an older run deploy last and overwrite fresher data.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Always build from the newest main, not the commit that queued the
      # run - so a delayed or re-run job can never ship out-of-date code.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull repos, READMEs and cover images from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/sync-github.mjs

      - name: Commit refreshed snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git diff --staged --quiet || git commit -m "chore: sync project data [skip ci]"
          git push || true

      - name: Trim files that should not ship
        run: rm -rf .git .github scripts

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
